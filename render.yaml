services:
  - type: web
    name: mood-movies-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    disk:
      name: mood-movies-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
